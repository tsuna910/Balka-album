<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バルカ入国ツアー｜旅のアルバム</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="バルカ入国ツアー｜旅のアルバム">
<meta property="og:description" content="お前は、VIVANTか？ 5日間のミッションの記録">
<meta property="og:url" content="https://tsuna910.github.io/Balka-album/">
<meta property="og:image" content="https://tsuna910.github.io/Balka-album/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="バルカ入国ツアー｜旅のアルバム">
<meta name="twitter:description" content="お前は、VIVANTか？ 5日間のミッションの記録">
<meta name="twitter:image" content="https://tsuna910.github.io/Balka-album/og-image.jpg">
<meta name="theme-color" content="#101a2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="album">

  <!-- 1. 表紙 -->
  <header class="cover reveal">
    <img class="cover-img" src="images/cover.jpg" alt="" onerror="this.remove()">
    <div class="cover-text">
      <h1 class="cover-title">バルカ入国ツアー</h1>
      <p class="cover-sub">VIVANTで「行ける」に変わるモンゴル5日間</p>
      <p class="cover-meta"><span>Aoi</span><span>2026年夏</span></p>
    </div>
  </header>

  <!-- 2. 1日目 -->
  <section class="day reveal">
    <h2 class="day-title">1日目</h2>
    <figure class="photo"><img src="images/d1-1.jpg" alt="1日目の写真1" loading="lazy" onerror="this.remove()"></figure>
    <figure class="photo"><img src="images/d1-2.jpg" alt="1日目の写真2" loading="lazy" onerror="this.remove()"></figure>
  </section>

  <!-- 3. 2日目 -->
  <section class="day reveal">
    <h2 class="day-title">2日目</h2>
    <figure class="photo"><img src="images/d2-1.jpg" alt="2日目の写真" loading="lazy" onerror="this.remove()"></figure>
  </section>

  <!-- 4. 3日目 -->
  <section class="day reveal">
    <h2 class="day-title">3日目</h2>
    <figure class="photo"><img src="images/d3-1.jpg" alt="3日目の写真" loading="lazy" onerror="this.remove()"></figure>
  </section>

  <!-- 5. 4日目 -->
  <section class="day reveal">
    <h2 class="day-title">4日目</h2>
    <figure class="photo"><img src="images/d4-1.jpg" alt="4日目の写真1" loading="lazy" onerror="this.remove()"></figure>
    <figure class="photo"><img src="images/d4-2.jpg" alt="4日目の写真2" loading="lazy" onerror="this.remove()"></figure>
  </section>

  <!-- 6. 5日目 -->
  <section class="day reveal">
    <h2 class="day-title">5日目</h2>
    <figure class="photo"><img src="images/d5-1.jpg" alt="5日目の写真" loading="lazy" onerror="this.remove()"></figure>
  </section>

  <!-- 8. 最後の問い -->
  <section class="closing reveal">
    <p class="closing-note">別世界は、仲間となら行ける場所かも。</p>
  </section>

  <!-- 9. ボタン -->
  <section class="share reveal">
    <button type="button" class="btn btn-primary" id="share-x">Xで共有</button>
    <button type="button" class="btn btn-secondary" id="copy-url">URLをコピー</button>
    <div class="copy-fallback" id="copy-fallback" hidden>
      <label for="copy-input">長押しでコピーしてください</label>
      <input type="text" id="copy-input" readonly>
    </div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
